---
configuration:
  vacuum_entity:
    name: Vacuum entity
    description: The Dreame vacuum entity from the Dreame Vacuum integration, e.g. vacuum.dreame_l10.
  device_name:
    name: Device name
    description: Name shown in Apple Home.
  cleaning_mode_entity:
    name: Cleaning mode select (optional)
    description: Leave empty to auto-detect select.<vacuum>_cleaning_mode.
  suction_level_entity:
    name: Suction level select (optional)
    description: Leave empty to auto-detect select.<vacuum>_suction_level.
  water_volume_entity:
    name: Water volume select (optional)
    description: Leave empty to auto-detect select.<vacuum>_water_volume.
  selected_map_entity:
    name: Selected map select (optional)
    description: Used to switch floors before cleaning rooms on another map. Leave empty to auto-detect.
  include_unnamed_rooms:
    name: Include unnamed rooms
    description: Also expose rooms the Dreame app has not named ("Room 7").
  on_off_cluster:
    name: Add On/Off cluster
    description: Required by Amazon Alexa. Leave off for Apple Home.
  matter_port:
    name: Matter port
    description: UDP port the Matter node listens on. Change it when another Matter server runs on this host.
  mdns_interface:
    name: mDNS network interface
    description: Limit Matter announcements to one interface, e.g. eth0. Leave empty for all.
  log_level:
    name: Log level
